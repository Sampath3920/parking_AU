spring.application.name=smart-parking-backend

# Datasource Configuration
# Defaults to embedded persistent H2 in MySQL mode so the application starts cleanly
# even before a cloud MySQL/PostgreSQL database is configured.
# Overridden simply by setting SPRING_DATASOURCE_URL in Render.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/parking;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Server Configuration
# Render sets the $PORT environment variable dynamically (default 10000 on Render, 4000 locally)
server.port=${PORT:4000}

# JWT Configuration
app.jwt.secret=${JWT_SECRET:SmartCollegeParkingSystemSecretKey2026VeryLongRandomKeyForJwtSecurity}
app.jwt.expiration-ms=86400000

# CORS Allowed Origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Admin Seed Configuration (creates default admin & guard accounts)
app.seed.enabled=${APP_SEED_ENABLED:true}
app.seed.password=${SEED_PASSWORD:ChangeMe@123}

# Manual Payment & Booking Configuration
app.payment.manual-amount=50.00
app.booking.require-payment=${APP_REQUIRE_PAYMENT:false}
