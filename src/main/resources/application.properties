spring.application.name=smart-parking-backend

spring.datasource.url=jdbc:mysql://localhost:3306/smart_parking
spring.datasource.username=root
spring.datasource.password=sampath

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:4000}

# --- JWT ---
# Change the secret for real use: set the JWT_SECRET environment variable (at least 32 characters).
app.jwt.secret=${JWT_SECRET:SmartCollegeParkingSystemSecretKey2026VeryLong}
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# --- Demo data (admin, guard, sample parking). Set enabled=false to switch off. ---
app.seed.enabled=true
app.seed.password=${SEED_PASSWORD:ChangeMe@123}

# Manual/demo fee; this is not a payment gateway and requires administrator verification.
app.payment.manual-amount=50.00
