services:
  # Spring Boot Backend Web Service (frontend is deployed separately on Vercel)
  - type: web
    name: smart-college-parking-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:mysql://mysql-1d6b13aa-anurag-835d.k.aivencloud.com:28541/defaultdb?sslMode=REQUIRED
      - key: SPRING_DATASOURCE_USERNAME
        value: avnadmin
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_DATASOURCE_DRIVER
        value: com.mysql.cj.jdbc.Driver
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_PASSWORD
        sync: false
      - key: APP_SEED_ENABLED
        value: "true"
      # Set this in the Render dashboard to your Vercel URL, e.g. https://your-app.vercel.app
      # (comma-separate multiple origins; no trailing slash)
      - key: CORS_ALLOWED_ORIGINS
        sync: false
