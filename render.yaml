services:
  # Spring Boot Backend Web Service
  - type: web
    name: smart-college-parking-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_PASSWORD
        sync: false
      - key: APP_SEED_ENABLED
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

  # React + Vite Frontend Static Site
  - type: web
    name: smart-college-parking-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: smart-college-parking-api
          property: host
